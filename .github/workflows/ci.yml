name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" packaging
      - name: Run tests
        run: python -m pytest -q

  quality:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install static-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff mypy types-python-dateutil types-pytz
      - name: Run Ruff
        run: ruff check OWNd tests setup.py
      - name: Run mypy
        run: mypy OWNd

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine check-wheel-contents
      - name: Build distributions
        run: python -m build --outdir build-artifacts
      - name: Validate distributions
        run: |
          python -m twine check build-artifacts/*
          check-wheel-contents build-artifacts/*.whl
