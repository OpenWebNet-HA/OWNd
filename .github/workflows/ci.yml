name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" packaging
      - name: Run test suite with coverage tracking
        run: |
          python -m pytest -q -p pytest_cov --cov=OWNd --cov-report=xml --cov-report=term-missing
      - name: Enforce test coverage on OWNd
        run: |
          python scripts/verify_coverage.py coverage.xml 80.0
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  quality:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install static-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff mypy types-python-dateutil types-pytz
      - name: Run Ruff
        run: ruff check OWNd tests setup.py scripts
      - name: Run mypy
        run: mypy OWNd
      - name: Enforce PyPI library standards & clean decoupling
        run: python scripts/verify_library_standards.py

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine check-wheel-contents validate-pyproject[all]
      - name: Validate pyproject.toml standards
        run: validate-pyproject pyproject.toml
      - name: Build distributions
        run: python -m build --outdir build-artifacts
      - name: Validate distributions
        run: |
          python -m twine check --strict build-artifacts/*
          check-wheel-contents build-artifacts/*.whl
      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: build-artifacts/*
          retention-days: 7
