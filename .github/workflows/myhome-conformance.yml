name: MyHOME conformance

# OWNd is what every MyHOME installation runs. A change here is only as safe
# as the integration that consumes it, so every push and pull request is
# checked against MyHOME's development branch, with this checkout installed
# in place of the pinned release:
#
#   which MyHOME - .github/myhome-conformance-ref, `master` unless a pull
#             request changes on purpose what MyHOME pins from OWNd (a gateway
#             profile's WHO list, a capability flag). MyHOME's committed
#             table, documents and tests describe the released OWNd, so such
#             a change names its companion MyHOME pull request there
#             (`pull/<N>`) and is tested against it; the two land together
#             with the release and the pin bump
#             (scripts/myhome_conformance_ref.py).
#   corpus  - the 451-vector golden corpus (tests/golden) plus MyHOME's own
#             smoke gates: the parser must produce the same objects for the
#             same frames. Fast and required.
#   suite   - MyHOME's full test suite. Catches the behavioural coupling
#             a signature or state-machine change introduces. Required too:
#             a failure here means the pin bump that follows a release
#             would fail, so it is better learned now.
#
# Both run on Python 3.14 only: that is what Home Assistant 2026.3+ needs,
# and the OWNd matrix already covers the older interpreters.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      myhome_ref:
        description: MyHOME ref to test against (empty = .github/myhome-conformance-ref)
        default: ""
        required: false

permissions:
  contents: read

jobs:
  corpus:
    name: Golden corpus & smoke gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: OWNd
      - name: Resolve the MyHOME ref to test against
        id: myhome
        working-directory: OWNd
        env:
          MYHOME_REF_INPUT: ${{ github.event.inputs.myhome_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/myhome_conformance_ref.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: OpenWebNet-HA/MyHOME
          ref: ${{ steps.myhome.outputs.ref }}
          path: MyHOME
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install this OWNd and MyHOME's test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./OWNd
          python -m pip install pytest-homeassistant-custom-component pytest-cov pytest-socket time-machine python-dateutil pytz freezegun requests-mock respx paho-mqtt tqdm jsonschema pyyaml packaging
          python -c "import OWNd, importlib.metadata as m; print('OWNd', m.version('OWNd'), 'from', OWNd.__file__)"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Validate OWNd Golden Corpus sync
        working-directory: OWNd
        run: python tools/golden/validate_corpus.py --check
      - name: Verify cross-repo Golden Corpus Staged-Superset compatibility
        working-directory: MyHOME
        run: |
          if [ -f scripts/sync_golden_corpus.py ]; then
            python scripts/sync_golden_corpus.py --from-ownd --ownd-dir ../OWNd
            python scripts/sync_golden_corpus.py --check --ownd-dir ../OWNd --require-ownd
          fi
          if [ -f tools/golden/check_trace_shape_coverage.py ]; then
            python tools/golden/check_trace_shape_coverage.py
          fi
      - name: Golden corpus and smoke gates against this checkout
        working-directory: MyHOME
        run: python scripts/run_ownd_smoke.py --target dev --skip-install

  suite:
    name: MyHOME test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: OWNd
      - name: Resolve the MyHOME ref to test against
        id: myhome
        working-directory: OWNd
        env:
          MYHOME_REF_INPUT: ${{ github.event.inputs.myhome_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/myhome_conformance_ref.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: OpenWebNet-HA/MyHOME
          ref: ${{ steps.myhome.outputs.ref }}
          path: MyHOME
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install this OWNd and MyHOME's test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./OWNd
          python -m pip install pytest-homeassistant-custom-component pytest-cov pytest-socket time-machine python-dateutil pytz freezegun requests-mock respx paho-mqtt tqdm jsonschema pyyaml packaging
      - name: MyHOME test suite against this checkout
        working-directory: MyHOME
        run: PYTHONPATH=. python -m pytest tests -q -p no:cacheprovider
