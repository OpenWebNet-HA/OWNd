        reference: "https://github.com/OpenWebNet-HA/MyHOME/issues/433"
        author: "issue #433 reporter (anonymized: frames and their spacing only)"
        date: "2026-09-23"
        gateway: "BTicino MH201"
        devices: "Eight shutters 11-18 (area 1): keypad point runs, a general UP (*2*0*0## + *2*1*0##) ended by one stop per actuator ~126 s later and none for WHERE 0, an area-1 stop echo (*2*0*1##)"
