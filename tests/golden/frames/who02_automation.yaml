# MH201 plant fixture (MyHOME tests/fixtures/plants/mh201_physical_plant, from
# MyHOME#378): a group-1 run on position-reporting actuators 19, 0110-0115. A
# stop to the group, then DOWN 0.59 s later; within 0.2-1.6 s every actuator
# echoed its own stop and DOWN (*2*2*0113## ...), and 5.4-24.3 s later each
# reported its own end-of-run stop. Nothing more arrived for #1 - the same
# WHO_2.pdf 3.0.1 rule as a general or area command. Unlike the MyHOME#433
# general UP, the per-object frames come right away as well as at the end.
- id: cover.evt.stop.group.1
