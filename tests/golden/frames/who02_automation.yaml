  who: 2
  what: 0
  where: "#1"
  scope: group
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Automation: STOP to group 1 (every actuator programmed into it); within 0.55 s actuators 0110, 0112, 0113, 0115 echoed their own *2*0*APL## (MH201 plant fixture)"
  roundtrip: true
  builder:
    class: OWNAutomationCommand
    method: stop_shutter
    args: ["#1"]

- id: cover.evt.down.group.1
  frame: "*2*2*#1##"
  direction: event
  who: 2
  what: 2
  where: "#1"
  scope: group
  source: community-plant-capture
  mcp_valid: true
  mcp_notes: "Automation: DOWN to group 1, 0.59 s after *2*0*#1##; all seven actuators echoed their own *2*2*APL## within 1 s and their own end-of-run *2*0*APL## 5.4-24.3 s after the group stop, none for #1 (MH201 plant fixture)"
  roundtrip: true
  builder:
    class: OWNAutomationCommand
    method: lower_shutter
    args: ["#1"]

