# The four `*#18*1*...##` records below are grammar-only fixtures. They were
# labelled `legrand-spec` with active-power / kWh-totalizer meanings, but WHO_18.pdf
# (Encyclopedia who-18 dimensions.md "Identifier table") defines no DIMENSION 1 and
# no DIMENSION 11: active power is 113, the totalizer is 51, and 11 is the ZigBee
# "Voltage" dimension of the separate variant (zigbee-variant.md "Dimension table").
# WHERE `1` is not a published family either (`1N` needs N = 1..127, addressing.md).
# No kWh on SCS WHO 18: the PDF labels DIMENSION 51..54 "Watt", 511/512 "Watt/h" and only
# 72 "Wh" (Encyclopedia README: preserve the published field semantics); OWNd and MyHOME read
# the totalizers as Wh. They stay as `conflict` records
# pinning parser shape only; OWNd gives them no `message_type` (report 21 E12).
- id: energy.req.active_power.meter1
  frame: "*#18*1*1##"
  direction: dimension_request
  who: 18
  what: null
  where: "1"
  dimension: 1
  source: conflict
  mcp_valid: true
  mcp_notes: "Grammar-only: DIMENSION 1 is not defined for SCS WHO 18 (active power is DIMENSION 113) and WHERE 1 is outside the 1N / 5N / 7N#0 families; parsed with message_type None"
  roundtrip: true

- id: energy.resp.active_power.meter1.1450
  frame: "*#18*1*1*1450##"
  direction: dimension_response
  who: 18
  what: null
  where: "1"
  dimension: 1
  dimension_values: ["1450"]
  source: conflict
  mcp_valid: true
  mcp_notes: "Grammar-only: DIMENSION 1 is not defined for SCS WHO 18, so 1450 carries no documented unit; parsed with message_type None"
  roundtrip: true

- id: energy.req.lifetime.meter1
  frame: "*#18*1*11##"
  direction: dimension_request
  who: 18
  what: null
  where: "1"
  dimension: 11
  source: conflict
  mcp_valid: true
  mcp_notes: "Grammar-only: DIMENSION 11 is the ZigBee variant's Voltage dimension, not an SCS totalizer (DIMENSION 51); parsed with message_type None"
  roundtrip: true

- id: energy.resp.lifetime.meter1.45230
  frame: "*#18*1*11*00452300##"
  direction: dimension_response
  who: 18
  what: null
  where: "1"
  dimension: 11
  dimension_values: ["00452300"]
  source: conflict
  mcp_valid: true
  mcp_notes: "Grammar-only: DIMENSION 11 is the ZigBee variant's Voltage dimension; 00452300 is kept raw without a unit (SCS WHO 18 energy values are Wh); parsed with message_type None"
  roundtrip: true

- id: energy.req.unit.meter51
  frame: "*#18*51*113##"
  direction: dimension_request
  who: 18
  what: null
  where: "51"
  dimension: 113
  source: openwebnet4j
  mcp_valid: true
  mcp_notes: "Energy Management: Request energy meter 51 diagnostic/unit parameter 113"
  roundtrip: true
  builder:
    class: OWNEnergyCommand
    method: request_active_power
    args: ["51"]

