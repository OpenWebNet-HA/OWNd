- id: alarm.req.status.zone2
  frame: "*#5*2##"
  direction: status_request
  who: 5
  what: null
  where: "2"
  source: openwebnet4j
  mcp_valid: true
  mcp_notes: "Burglar Alarm: openwebnet4j spelling of a zone 2 status request. The published zone request is *#5*#2## (Encyclopedia functional/who-5-alarm/protocol.md#zone-status-request, zone selector #N) and this prefix-less form is not on the page; OWNd accepts it and keeps WHERE 2 as given"
  roundtrip: true

