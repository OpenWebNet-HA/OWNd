[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# Start with correctness checks that the existing code already satisfies.
# Broader style and bugbear rules can be enabled incrementally as the runtime
# hardening work is reviewed.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# Current mypy releases no longer target Python 3.8, while OWNd still supports
# it at runtime. Python 3.8 compatibility is covered by the test matrix below.
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
implicit_optional = true
warn_unused_configs = true

# Existing typing debt is recorded explicitly so new classes of errors fail CI.
# These exclusions should be removed as the affected modules are modernised.
disable_error_code = [
    "arg-type",
    "assignment",
    "index",
    "operator",
    "return",
    "return-value",
    "truthy-function",
    "union-attr",
    "var-annotated",
]
