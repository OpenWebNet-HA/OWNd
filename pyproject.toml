[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:homeassistant"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with correctness checks that the existing code already satisfies.
# Broader style and bugbear rules can be enabled incrementally as the runtime
# hardening work is reviewed.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# Keep static analysis aligned with the oldest supported runtime.
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
implicit_optional = true
warn_unused_configs = true

# Existing typing debt is recorded explicitly so new classes of errors fail CI.
# These exclusions should be removed as the affected modules are modernised.
disable_error_code = [
    "arg-type",
    "assignment",
    "index",
    "operator",
    "return",
    "return-value",
    "truthy-function",
    "union-attr",
    "var-annotated",
]

[tool.coverage.run]
source = ["OWNd"]
branch = true
omit = [
    "OWNd/__main__.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
