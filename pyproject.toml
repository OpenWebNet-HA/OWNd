[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OWNd"
dynamic = ["version"]
description = "Python interface for the OpenWebNet protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "anotherjulien", email = "yetanotherjulien@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp",
    "defusedxml",
]

[project.optional-dependencies]
serial = ["pyserial-asyncio>=0.6"]
test = [
    "pytest<10",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/OpenWebNet-HA/OWNd"
Repository = "https://github.com/OpenWebNet-HA/OWNd"
Issues = "https://github.com/OpenWebNet-HA/OWNd/issues"

[tool.setuptools.dynamic]
version = { attr = "OWNd.__version__" }

[tool.setuptools.packages.find]
include = ["OWNd*"]

[tool.setuptools.package-data]
OWNd = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:homeassistant"
# pytest-asyncio >= 1.4.1 warns at configure time when this is unset, and
# `filterwarnings = error::DeprecationWarning` below turns that warning into
# an INTERNALERROR before any test is collected. "function" is the scope the
# suite has always used (every async fixture is function-scoped).
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with correctness checks that the existing code already satisfies.
# Broader style and bugbear rules can be enabled incrementally as the runtime
# hardening work is reviewed.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# Keep static analysis aligned with the oldest supported runtime.
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "defusedxml.*",
    "serial_asyncio.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["OWNd"]
branch = true
omit = [
    "OWNd/__main__.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]

