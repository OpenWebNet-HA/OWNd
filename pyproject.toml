[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:homeassistant"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with correctness checks that the existing code already satisfies.
# Broader style and bugbear rules can be enabled incrementally as the runtime
# hardening work is reviewed.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# Keep static analysis aligned with the oldest supported runtime.
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "dateutil.*",
    "defusedxml.*",
    "serial_asyncio.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["OWNd"]
branch = true
omit = [
    "OWNd/__main__.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
